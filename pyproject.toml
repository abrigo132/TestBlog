[project]
name = "testblog"
version = "0.1.0"
description = ""
authors = [
    {name = "abrigo",email = "chistiakov.dn@dom.ru"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "django-ninja (>=1.6.2,<2.0.0)",
    "django-ninja-jwt (>=5.4.5,<6.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
